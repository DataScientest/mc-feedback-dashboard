# Reverse proxy nginx (service "nginx" de docker-compose.yml) - HTTPS.
#
# Prérequis : un certificat Let's Encrypt sur l'hôte EC2, obtenu AVANT de
# démarrer la stack (port 80 libre) :
#   sudo certbot certonly --standalone -d dashboard.example.com
# Le dossier /etc/letsencrypt de l'hôte est monté dans le conteneur nginx.
#
# Remplacer `dashboard.example.com` par votre domaine (3 occurrences).
# Tant que vous n'avez pas de domaine/certificat, montez plutôt
# deploy/nginx.http.conf (voir docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # Renouvellement Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste du trafic HTTP est redirigé vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads CSV : limite raisonnable
    client_max_body_size 25m;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://slack-bot:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Les actualisations de données peuvent être longues
        proxy_read_timeout 300;
    }

    # Optionnel : restreindre l'accès à une liste d'IP (bureau / VPN)
    # allow 203.0.113.0/24;
    # deny all;
}
