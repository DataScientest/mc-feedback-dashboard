# Reverse proxy nginx - variante HTTP seul (bootstrap).
#
# À utiliser UNIQUEMENT tant que vous n'avez pas encore de domaine ou de
# certificat TLS (et sans ENFORCE_HTTPS=true dans le .env, sinon l'app
# redirigera vers un port 443 qui ne répond pas).
# Dès que le certificat est prêt, repasser sur deploy/nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://slack-bot:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300;
    }
}
